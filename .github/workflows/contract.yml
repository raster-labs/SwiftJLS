name: Milestone 1 contract

# Contract 0.5.0 PLAT-01: Swift 6.2 is the manifest minimum and Swift 6.4 the
# qualified primary toolchain, so both are built and tested here. A gate that
# cannot run is an unexecuted gate, not a pass (POL-08), so every job below uses
# a generally available image or runner. No OS 27 job exists because no stable
# runner ships those SDKs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-identity:
    name: Shared contract byte-identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # POL-03 requires the seven shared documents to stay byte-identical across
      # all four repositories. Checking the recorded manifest here catches local
      # drift immediately; cross-repository comparison belongs to the suite
      # harness, which cannot run from inside one repository.
      - name: Verify COMMON_CONTRACT_SHA256.txt matches the documents
        working-directory: Documentation
        run: sha256sum -c COMMON_CONTRACT_SHA256.txt

  linux:
    name: Swift ${{ matrix.swift }} / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        swift: ['6.2', '6.4']
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: swift build -c release
      - run: swift test -c release
      - name: Install payload test runtime
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Payload CLI regression
        run: python3 Scripts/test-payload-cli.py --binary .build/release/swiftjls-cli --output /tmp/payload-cli.json

  macos:
    name: macOS 26 / selected Xcode toolchain
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift --version
      - run: xcodebuild -version
      - run: swift build
      - run: swift test
      - name: Address sanitizer
        run: swift test --scratch-path .build/asan --sanitize address
      - name: Thread sanitizer
        run: swift test --scratch-path .build/tsan --sanitize thread

  independent-consumer:
    name: Independent consumer resolves at tools 6.2
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: package
      # POL-01/POL-02: a consumer must build against this package alone, with no
      # sibling checkout and no suite dependency, on the declared manifest floor.
      - name: Build a fresh consumer against the checkout
        run: |
          set -eux
          NAME="$(grep -m1 -oE 'name: "Swift[A-Z0-9]+"' "$GITHUB_WORKSPACE/package/Package.swift" \
                  | grep -oE 'Swift[A-Z0-9]+')"
          mkdir -p /tmp/consumer/Sources/Consumer
          cd /tmp/consumer
          {
            echo '// swift-tools-version: 6.2'
            echo 'import PackageDescription'
            echo 'let package = Package('
            echo '    name: "Consumer",'
            echo "    dependencies: [.package(path: \"$GITHUB_WORKSPACE/package\")],"
            echo '    targets: [.executableTarget(name: "Consumer", dependencies: ['
            # SwiftPM derives a local dependency's identity from its directory.
            echo "        .product(name: \"$NAME\", package: \"package\")])]"
            echo ')'
          } > Package.swift
          cp "$GITHUB_WORKSPACE/package/Examples/IndependentConsumer/Sources/Consumer/main.swift" Sources/Consumer/main.swift
          swift build
          swift run Consumer

  cross-codec-consumer:
    name: Pinned development-only cross-codec consumer
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift run -c release --package-path Examples/CrossCodecConsumer
      - name: Measure scoped pixel copies and verify an injected copy is detected
        run: swift run -c release --package-path Examples/CopyProbe CopyProbe Tests/SwiftJLSTests/Fixtures > /tmp/copy-probe.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scoped-pixel-copy-probe
          path: /tmp/copy-probe.json
      - name: Observe file access during the in-process routes
        run: |
          apt-get update && apt-get install -y --no-install-recommends strace python3
          python3 Scripts/StorageEvidence/trace-files.py --binary Examples/CrossCodecConsumer/.build/release/CrossCodecConsumer --output /tmp/file-observation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-codec-file-observation
          path: /tmp/file-observation
      - name: Collect ordinary-release allocator stacks
        run: |
          apt-get install -y --no-install-recommends heaptrack
          swift build -c release -Xswiftc -g --package-path Examples/CrossCodecConsumer
          python3 Scripts/StorageEvidence/trace-heap.py --binary Examples/CrossCodecConsumer/.build/release/CrossCodecConsumer --output /tmp/heap-observation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-codec-heap-observation
          path: /tmp/heap-observation
      - name: Collect component, mapping and predecessor-profile allocator stacks
        run: |
          swift build -c release -Xswiftc -g --package-path Examples/CopyProbe
          python3 Scripts/StorageEvidence/trace-heap.py --binary Examples/CopyProbe/.build/release/CopyProbe --output /tmp/profile-heap --scope 'Ordinary release scalar/component/mapping/HP/extended/subsampled profiles; setup and runtime included' -- Tests/SwiftJLSTests/Fixtures --heap-only
          python3 Scripts/StorageEvidence/classify-heap.py --heap /tmp/profile-heap --output /tmp/profile-heap/classification.json --revision "$GITHUB_SHA" --scope 'Ten encode/caller-decode profiles plus legacy, extended, mapping and subsampled caller decodes'
          python3 Scripts/StorageEvidence/measure-peaks.py --self-test
          python3 Scripts/StorageEvidence/measure-peaks.py --profile /tmp/profile-heap/allocations.gz --output /tmp/profile-heap/peaks.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: predecessor-profile-heap-observation
          path: /tmp/profile-heap
      - name: Measure bounded concurrent scalar and colour resources
        run: |
          swift build --package-path Examples/ResourceStress -c release -Xswiftc -g
          python3 Scripts/StorageEvidence/trace-heap.py --binary Examples/ResourceStress/.build/release/ResourceStress --output /tmp/concurrent-heap --scope 'Four bounded workers; 32 512x512 scalar/colour lossless/near-lossless frame transactions'
          python3 Scripts/StorageEvidence/measure-peaks.py --profile /tmp/concurrent-heap/allocations.gz --output /tmp/concurrent-heap/peaks.json --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: concurrent-resource-heap-observation
          path: /tmp/concurrent-heap
      - name: Verify allocator evidence detects a hidden frame copy
        run: python3 Scripts/StorageEvidence/mutate-copy.py --baseline /tmp/heap-observation --output /tmp/copy-mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cross-codec-copy-mutation
          path: /tmp/copy-mutation


  macos-intel:
    name: macOS 26 Intel scalar runtime
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift --version && uname -m
      - run: swift test -c release

  apple-sdk-builds:
    name: Apple SDK compile / ${{ matrix.sdk }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphonesimulator
            triple: arm64-apple-ios26.0-simulator
          - sdk: appletvsimulator
            triple: arm64-apple-tvos26.0-simulator
          - sdk: watchsimulator
            triple: arm64-apple-watchos26.0-simulator
          - sdk: xrsimulator
            triple: arm64-apple-xros26.0-simulator
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: swift --version && xcodebuild -version
      - name: Compile library target only
        env:
          SDK_NAME: ${{ matrix.sdk }}
          TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          SDK_PATH=$(xcrun --sdk "$SDK_NAME" --show-sdk-path)
          if [ "$SDK_NAME" = xrsimulator ]; then
            # See apple-runtime.yml: SwiftPM on this runner misparses XR's
            # deployment target as 26.26.0. Keep the explicit 26.0 driver check.
            xcrun swiftc -O -swift-version 6 -strict-concurrency=complete -parse-as-library -emit-library -emit-module -module-name SwiftJLS -target "$TARGET_TRIPLE" -sdk "$SDK_PATH" Sources/SwiftJLS/*.swift Sources/SwiftJLS/JPEGLS/*.swift -emit-module-path /tmp/SwiftJLS.swiftmodule -o /tmp/libSwiftJLS.dylib
          else
            swift build --target SwiftJLS -c release --triple "$TARGET_TRIPLE" --sdk "$SDK_PATH"
          fi

  release-preparation:
    name: Release preparation / Swift ${{ matrix.swift }} / ${{ matrix.engine }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift: '6.2'
            engine: native
          - swift: '6.4'
            engine: swiftbuild
    container: swift:${{ matrix.swift }}-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install preparation prerequisites
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 git man-db mandoc
          # Minimal Ubuntu images divert `man` to a success-returning notice.
          # Exercise the real installed man-db binary against our staged manual.
          if [ -x /usr/bin/man.REAL ]; then
            install -m 755 /usr/bin/man.REAL /usr/local/bin/man
          fi
      - name: Trust only this checkout in the job container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Release evidence negative controls
        run: python3 -m unittest discover -s Scripts/ReleasePreparation -p 'test_*.py' -v
      - name: Audit pinned source and fixture provenance
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/raster-labs/JLSwift.git /tmp/swiftjls-predecessor
          python3 Scripts/ReleasePreparation/provenance.py --predecessor /tmp/swiftjls-predecessor --output /tmp/swiftjls-provenance.json
          python3 Scripts/ReleasePreparation/provenance-controls.py --predecessor /tmp/swiftjls-predecessor --output /tmp/swiftjls-provenance-controls.json
      - name: Versioned and hosted consumption, documentation and CLI packaging
        env:
          BUILD_ENGINE: ${{ matrix.engine }}
        run: python3 Scripts/ReleasePreparation/prepare.py --build-system "$BUILD_ENGINE" --output /tmp/swiftjls-preparation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-preparation-swift-${{ matrix.swift }}
          path: |
            /tmp/swiftjls-provenance.json
            /tmp/swiftjls-provenance-controls.json
            /tmp/swiftjls-preparation/report.json
            /tmp/swiftjls-preparation/*.log
            /tmp/swiftjls-preparation/*/Package.swift
            /tmp/swiftjls-preparation/*/Package.resolved
            /tmp/swiftjls-preparation/cli-process/
            /tmp/swiftjls-preparation/cli-payload.json
