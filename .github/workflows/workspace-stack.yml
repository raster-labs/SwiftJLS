name: Marked workspace stack observation
on:
  push:
    paths:
      - '.github/workflows/workspace-stack.yml'
      - 'Scripts/StorageEvidence/measure-massif.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stacks:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        operation: [encode, owned, into, inspect]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the development-only phase markers
        run: |
          apt-get update && apt-get install -y --no-install-recommends valgrind python3
          swift build -c release -Xswiftc -g --package-path Examples/WorkspaceProbe
      - name: Observe heap and stack between operation markers
        env:
          OPERATION: ${{ matrix.operation }}
        run: |
          binary="$GITHUB_WORKSPACE/Examples/WorkspaceProbe/.build/release/WorkspaceProbe"
          mkdir -p /tmp/stack-evidence
          valgrind --version > /tmp/stack-evidence/version.txt
          sha256sum "$binary" > /tmp/stack-evidence/binary.sha256
          for components in 1 3; do
            for near in 0 3; do
              output="/tmp/stack-evidence/$components-$near-$OPERATION"
              mkdir -p "$output"
              cd "$output"
              timeout 240 valgrind --tool=massif --stacks=yes --time-unit=B --detailed-freq=1 --max-snapshots=1000 --peak-inaccuracy=0 --massif-out-file=massif.out "$binary" "$OPERATION" 512 512 "$components" "$near" > consumer.json 2> tool.log
              python3 "$GITHUB_WORKSPACE/Scripts/StorageEvidence/measure-massif.py" --directory "$output" --revision "$GITHUB_SHA"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-stacks-${{ matrix.operation }}
          path: /tmp/stack-evidence
