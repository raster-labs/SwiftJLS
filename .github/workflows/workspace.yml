name: Per-operation workspace evidence
on:
  push:
    paths:
      - 'Sources/**'
      - 'Examples/WorkspaceProbe/**'
      - 'Scripts/StorageEvidence/measure-operation.py'
      - '.github/workflows/workspace.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  allocations:
    runs-on: ubuntu-24.04
    container: swift:6.4-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build marked ordinary-release consumer
        run: |
          apt-get update && apt-get install -y --no-install-recommends heaptrack python3
          swift build -c release -Xswiftc -g --package-path Examples/WorkspaceProbe
          python3 Scripts/StorageEvidence/measure-operation.py --self-test
      - name: Measure individual public operations
        run: |
          mkdir -p /tmp/workspace-evidence
          for size in 17 512; do
            for components in 1 3; do
              for near in 0 3; do
                for operation in encode owned into inspect; do
                  output="/tmp/workspace-evidence/$size-$components-$near-$operation"
                  python3 Scripts/StorageEvidence/trace-heap.py --binary Examples/WorkspaceProbe/.build/release/WorkspaceProbe --output "$output" --scope 'One marked operation; setup remains live and verification follows the end marker' -- "$operation" "$size" "$size" "$components" "$near"
                  python3 Scripts/StorageEvidence/measure-operation.py --profile "$output/allocations.gz" --output "$output/operation.json" --revision "$GITHUB_SHA"
                done
              done
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: per-operation-workspace
          path: /tmp/workspace-evidence
